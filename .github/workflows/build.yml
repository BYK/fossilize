name: Build & Test

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ${{ github.ref_name || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup NPM dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Store dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          if-no-files-found: error
          path: dist/**

  test:
    name: Smoke Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup NPM dependencies
        run: npm install

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
          merge-multiple: true

      - name: Smoke test
        run: |
            node dist/bin/cli.js

      - name: Test with asset (and V8 code cache acceptance)
        run: |
            cd test
            # Build a single-platform host binary with an embedded V8 code
            # cache (the exact config from issue #28). Assert the cache is
            # actually embedded AND that it is accepted at runtime (no
            # "Code cache data rejected" warning). macos-latest is arm64,
            # which is where the cache rejection originally reproduced.
            build_log=$(node ../dist/bin/cli.js -a asset.txt --no-bundle sample.cjs 2>&1)
            echo "$build_log"
            if ! echo "$build_log" | grep -q "with code cache"; then
              echo "FAIL: host binary was built without an embedded V8 code cache"
              exit 1
            fi
            set -- dist-bin/sample-*
            bin=$1
            echo "Running $bin"
            set +e
            actual=$("$bin" 2>stderr.txt)
            rc=$?
            set -e
            echo "----- stderr -----"; cat stderr.txt; echo "------------------"
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: binary exited with code $rc"
              exit 1
            fi
            if grep -q "Code cache data rejected" stderr.txt; then
              echo "FAIL: V8 rejected the embedded code cache at runtime (issue #28)"
              exit 1
            fi
            expected=$(cat asset.txt)
            [ "$actual" = "$expected" ]

      - name: Test --ignore-node-options keeps the code cache valid under NODE_OPTIONS
        run: |
            cd test
            # A user's V8 flags in NODE_OPTIONS change V8's FlagList::Hash() and
            # would otherwise make V8 reject the embedded code cache at runtime
            # ("Code cache data rejected"). --ignore-node-options neutralizes the
            # NODE_OPTIONS lookup in the binary so the cache stays valid.
            build_log=$(node ../dist/bin/cli.js -a asset.txt --no-bundle --ignore-node-options sample.cjs 2>&1)
            echo "$build_log"
            if ! echo "$build_log" | grep -q "neutralized NODE_OPTIONS"; then
              echo "FAIL: NODE_OPTIONS lookup was not neutralized"
              exit 1
            fi
            if ! echo "$build_log" | grep -q "with code cache"; then
              echo "FAIL: code cache was not embedded (it should still be kept)"
              exit 1
            fi
            set -- dist-bin/sample-*
            bin=$1
            echo "Running $bin with NODE_OPTIONS set"
            set +e
            actual=$(NODE_OPTIONS='--stack-trace-limit=99 --max-semi-space-size=128' "$bin" 2>stderr.txt)
            rc=$?
            set -e
            echo "----- stderr -----"; cat stderr.txt; echo "------------------"
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: binary exited with code $rc"
              exit 1
            fi
            if grep -q "Code cache data rejected" stderr.txt; then
              echo "FAIL: code cache rejected despite --ignore-node-options"
              exit 1
            fi
            expected=$(cat asset.txt)
            [ "$actual" = "$expected" ]

  artifacts:
    name: Artifacts
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Pack tarball
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: '*.tgz'
